<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
       <!-- <link rel="stylesheet" href="./css/room.css"> -->
       <link rel="stylesheet" href="./css/map.css">
       <!-- <link rel="stylesheet" href="./css/dark-map.css"> -->

</head>
<body class="room-body">
    <div class="dark-container"></div>
    <img class="map-img" src="./img/1x/mapsettings.png">
    
    <div class="body-container">
    <header class="page-header">
        <div class="logo-container">
            <img class="header-logo" src="./img/1x/Asset 1.png"
                alt="INNI logo">
        </div>
        
        <div class="invisible-container"></div>
        <div class="second-container"></div>
        <div class="header-container">
           
            <ul class="header-list">
                <li class="header-item">
                    <div class="white-container"></div><span class="header-text">preview</span></li>
                <li class="header-item">
                    <div class="white-container"></div><span class="header-text">search</span> </li>
            </ul>

            <ul class="header-nav">
                <li class="nav-item">
                    <div class="white-container"></div><span class="header-text">ukr</span></li>
                <li class="nav-item">
                    <div class="white-container"></div><span class="header-text">ira</span></li>
                <li class="nav-item">
                    <div class="white-container"></div><img class="settings-icon"
                    src="./img/1x/Asset 3settings.png"
                ></li>
            </ul>
        </div>
   
    </header>
    <main class="map-section">
        <div class="room-container">

            <div class="top-gradient"></div>
            <div class="left-gradient"></div>
            <div class="bottom-gradient"></div>

            <div class="top-dark-gradient"></div>
            <div class="left-dark-gradient"></div>
            <div class="bottom-dark-gradient"></div>
    
            <svg id="bell" class="bell" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25.68 29.85">
                
                <g id="bell-icon" data-name="bell-icon">

                </g>
            </svg>
        

            <div class="welcome-container"></div>

            <ul class="system-list">
                <li class="system-item">
                    <div class="system-text-container">Security system update<br>
                    completed.
                    </div>  
                </li>
                <div class="first-decorate"></div>
                </ul>

                <div class="inni-hub-container">

                <h3 class="inni-hub-text">INNI HUB GROUP</h3>
                <p class="hub-name">officeroom</p>

                <ul class="hub-list"> 
                    <li class="hub-item">Arm</li>
                    <li class="hub-item">Disarm</li>
                </ul>
                <img class="hub-list-line-1" src="./img/1x/hub-list-linesettings.png"
                alt="hub list line">

                <p class="hub-name">showroom</p>

                <ul class="hub-list"> 
                    <li class="hub-item">Arm</li>
                    <li class="hub-item">Disarm</li>
                </ul>
    
                <img class="hub-list-line-2" src="./img/1x/hub-list-linesettings.png"
                alt="hub list line">

            </div>

            <img class="blue-marcer" src="./img/1x/blue-map-marcersettings.png"
            alt="blue map marcer">

            <img class="red-marcer" src="./img/1x/red-map-marcersettings.png"
            alt="red map marcer">

            <img class="orange-marcer" src="./img/1x/orange-map-marcersettings.png"
            alt="orange map marcer">
    
    </div>
    <div class="ajax-container">
        <img class="ajax-image" src="./img/1x/Asset 12settings.png">
    </div>

    <img class="ajax-line" src="./img/1x/ajax-linesettings.png">
    <p class="inni-room-text">ⓒ2022 - «INNI» All rights reserved</p>
</div>    
<div class="clock-container">
    <div class="clock" id="clock">
        <div id="time">00:00:00</div>
        <div id="timezone"></div>
        <div id="location"></div>
    </div>
</div>
</main>
</div>
<script src="./clock.js"></script>
</body>
</html>
