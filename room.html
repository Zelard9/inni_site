<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

       <link rel="stylesheet" href="./css/dark-room.css">
</head>
<body class="room-body">
    <div class="body-container">
    <header class="page-header">
        <div class="logo-container">
            <img class="header-logo" src="./img/1x/Asset 1.png"
                alt="INNI logo">
        </div>
        
        <div class="invisible-container"></div>
        <div class="header-container">
           
            <ul class="header-list">
                <li class="header-item">
                    <div class="white-container"></div>
                        <a class="header-link" href="./room.html">preview</a></li>
                <li class="header-item">
                    <div class="white-container"></div> 
                    <a class="header-link" href="./map.html">search</a></li>
            </ul>

            <ul class="header-nav">
                <li class="nav-item">
                    <div class="white-container"></div>
                        <a class="header-link" href="./map.html">ukr</a></li>
                <li class="nav-item">
                    <div class="white-container"></div><a class="header-link" href="./map.html">ira</a></li>
                <li class="nav-item">
                    <div class="white-container"></div>
                    <a class="settings-link" href="./"><img class="settings-icon"
                        src="./img/1x/Asset 3settings.png">
                    </a>
                    
                </li>
            </ul>
        </div>
   
    </header>
    <main class="room-section">
        <div class="room-container">

            </svg>
        </a>

        <ul class="system-list">
        <li class="system-item"><div class="first-decorate"></div>
            <div class="system-text-container">Security system update<br>
            completed.
            </div>  
        </li>
        <li class="system-item"><div class="second-decorate"></div>
            <div class="system-text-container"><span class="attention">Attention!</span> <br> Suspicious activity detected.
            </div>
         </li>
        <li class="system-item"><div class="third-decorate"></div>
            <div class="system-text-container"><span class="focused-attention">We focus your attention...</span> <br>Аctivity detected at 10.30. 
            </div>
            </li>
    </ul>

    <div class="photo-container">
        <div class="text-container"> 
            <img class="first-icon" src="./img/1x/Asset 5settings.png"
            alt="room settings icon">
            <h2 class="room-title">Room name</h2>
        </div>
       
        <div class="room-img-container">
            <img class="room-image" src="./img/1x/Asset 8settings.png">
            <img class="ring-room-img-1" src="./img/1x/ring-iconsettings.png">
            <img class="ring-room-img-2" src="./img/1x/ring-iconsettings.png">
            <img class="ring-room-img-3" src="./img/1x/ring-iconsettings.png">
            <img class="ring-room-img-4" src="./img/1x/ring-iconsettings.png">
            <img class="camera-room-img" src="./img/1x/camera-iconsettings.png">
            <ul class="sensors">
                <li><img class="sensor-room-img" src="./img/1x/sensor-icon_1settings.png"></li>
                <li><img class="sensor-room-img" src="./img/1x/sensor-icon_1settings.png"></li>
                <li><img class="sensor-room-img" src="./img/1x/sensor-icon_1settings.png"></li>
            </ul>
        </div>
    </div>
    <div class="ajax-container">
        <img class="ajax-image" src="./img/1x/Asset 12settings.png">
    </div>
    <p class="inni-room-text">ⓒ2022 - «INNI» All rights reserved</p>
</div>    
<div class="clock-container">
    <div class="clock" id="clock">
        <div id="time">00:00:00</div>
        <div id="timezone"></div>
        <div id="location"></div>
    </div>
</div>
</main>
</div>
<script src="./clock.js"></script>
</body>
</html>
